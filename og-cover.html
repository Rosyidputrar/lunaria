<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Lunaria — OG cover</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap");
  * { box-sizing: border-box; margin: 0; }
  html, body { overflow: hidden; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: "Plus Jakarta Sans", sans-serif;
    background: #07080e; color: #edeff7; position: relative;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(80px); }
  .g1 { width: 620px; height: 620px; top: -260px; right: -160px; background: radial-gradient(circle, rgba(76,141,255,.45), transparent 68%); }
  .g2 { width: 520px; height: 520px; bottom: -260px; left: -160px; background: radial-gradient(circle, rgba(138,123,255,.4), transparent 70%); }
  .frame { position: relative; height: 100%; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
  .mark { width: 44px; height: 44px; border-radius: 13px; background: linear-gradient(150deg,#8a7bff,#4c8dff); display: grid; place-items: center; }
  .mark svg { width: 25px; height: 25px; color: #0a0715; }
  h1 { font-size: 64px; line-height: 1.05; letter-spacing: -.04em; font-weight: 800; max-width: 12ch; }
  .grad { background: linear-gradient(100deg,#b9aeff,#8a7bff 45%,#4c8dff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 22px; font-size: 24px; color: #9299ae; max-width: 34ch; line-height: 1.5; }
  .stats { display: flex; gap: 56px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,.1); }
  .stat b { display: block; font-size: 32px; letter-spacing: -.04em; font-weight: 800; }
  .stat span { font-size: 15px; color: #9299ae; }
  .chart { position: absolute; right: 72px; top: 150px; width: 372px; }
  .chart svg { width: 100%; height: 170px; overflow: visible; }
  .tag { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 8px 16px; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; font-size: 16px; color: #c3c7d6; }
  .tag i { width: 8px; height: 8px; border-radius: 50%; background: #37d9a0; }
</style>
</head>
<body>
  <span class="glow g1"></span>
  <span class="glow g2"></span>
  <div class="frame">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3.5a8.5 8.5 0 1 0 0 17 9.5 9.5 0 0 1 0-17z"/></svg>
      </span>
      Lunaria
    </div>

    <div>
      <h1>Uang usaha Anda<br>akhirnya <span class="grad">terbaca jelas.</span></h1>
      <p class="sub">Pemasukan, pengeluaran, dan arus kas untuk freelance dan UKM.</p>
    </div>

    <div class="stats">
      <div class="stat"><b>12,4 rb</b><span>usaha aktif</span></div>
      <div class="stat"><b>Rp 1,8 T</b><span>arus kas tercatat</span></div>
      <div class="stat"><b>3 jam</b><span>hemat per bulan</span></div>
    </div>
  </div>

  <div class="chart">
    <svg viewBox="0 0 420 170">
      <defs>
        <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8a7bff"/><stop offset="1" stop-color="#4c8dff"/>
        </linearGradient>
        <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8a7bff" stop-opacity=".34"/><stop offset="1" stop-color="#8a7bff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M6 128 L74 104 L142 116 L210 72 L278 84 L346 40 L414 56 L414 170 L6 170 Z" fill="url(#a)"/>
      <path d="M6 128 L74 104 L142 116 L210 72 L278 84 L346 40 L414 56" fill="none" stroke="url(#l)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="346" cy="40" r="7" fill="#0b0d14" stroke="#cfc8ff" stroke-width="4"/>
      <circle cx="414" cy="56" r="7" fill="#0b0d14" stroke="#cfc8ff" stroke-width="4"/>
    </svg>
  </div>
</body>
</html>
